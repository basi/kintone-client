name: Kintone API仕様更新

on:
  schedule:
    # 毎週月曜日 3:00 UTC (日本時間 12:00)
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      force_update:
        description: '変更がなくても強制的に更新する'
        required: false
        default: 'false'
        type: boolean

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: PHP環境をセットアップ
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '8.1'
          tools: composer

      - name: 現在のAPI仕様バージョンを取得
        id: current_version
        run: |
          if [ -d "rest-api-spec" ]; then
            CURRENT_VERSION=$(find rest-api-spec -maxdepth 1 -type d -name "20*" | sort -r | head -1 | xargs basename 2>/dev/null || echo "none")
          else
            CURRENT_VERSION="none"
          fi
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "現在のAPIバージョン: $CURRENT_VERSION"

      - name: 最新のAPI仕様をダウンロード
        run: |
          bash scripts/update-spec.sh

      - name: 最新のAPI仕様バージョンを取得
        id: latest_version
        run: |
          LATEST_VERSION=$(find rest-api-spec -maxdepth 1 -type d -name "20*" | sort -r | head -1 | xargs basename 2>/dev/null || echo "none")
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "最新のAPIバージョン: $LATEST_VERSION"

      - name: バージョン変更をチェック
        id: check_version_changes
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.version }}"
          LATEST_VERSION="${{ steps.latest_version.outputs.version }}"
          FORCE_UPDATE="${{ github.event.inputs.force_update }}"
          
          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ] || [ "$FORCE_UPDATE" = "true" ]; then
            echo "has_version_changes=true" >> $GITHUB_OUTPUT
            echo "バージョン変更が検出されたか、強制更新が要求されました"
          else
            echo "has_version_changes=false" >> $GITHUB_OUTPUT
            echo "バージョン変更は検出されませんでした"
          fi

      - name: 上流リポジトリ情報を取得
        id: upstream_info
        if: steps.check_version_changes.outputs.has_version_changes == 'true'
        run: |
          # 上流リポジトリから最新コミット情報を取得
          UPSTREAM_REPO="kintone/rest-api-spec"
          LATEST_COMMIT=$(curl -s "https://api.github.com/repos/$UPSTREAM_REPO/commits/main" | jq -r '.sha[:7]')
          LATEST_COMMIT_URL=$(curl -s "https://api.github.com/repos/$UPSTREAM_REPO/commits/main" | jq -r '.html_url')
          LATEST_COMMIT_MESSAGE=$(curl -s "https://api.github.com/repos/$UPSTREAM_REPO/commits/main" | jq -r '.commit.message' | head -1)
          
          # バージョン比較用のURL（現在のバージョンがnoneの場合は単純なコミットページ）
          if [ "${{ steps.current_version.outputs.version }}" = "none" ]; then
            COMPARE_URL="https://github.com/$UPSTREAM_REPO/commits/main"
          else
            COMPARE_URL="https://github.com/$UPSTREAM_REPO/compare/${{ steps.current_version.outputs.version }}...${{ steps.latest_version.outputs.version }}"
          fi
          
          echo "commit_sha=$LATEST_COMMIT" >> $GITHUB_OUTPUT
          echo "commit_url=$LATEST_COMMIT_URL" >> $GITHUB_OUTPUT
          echo "commit_message=$LATEST_COMMIT_MESSAGE" >> $GITHUB_OUTPUT
          echo "compare_url=$COMPARE_URL" >> $GITHUB_OUTPUT

      - name: PHPクライアントを再生成
        if: steps.check_version_changes.outputs.has_version_changes == 'true'
        run: |
          composer install --no-dev
          composer generate

      - name: 生成されたコードの差分をチェック
        id: check_code_changes
        if: steps.check_version_changes.outputs.has_version_changes == 'true'
        run: |
          # Gitの設定（コミット作成のため）
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # 生成されたファイルをステージング
          git add src/
          
          # 差分があるかチェック
          if git diff --cached --quiet; then
            echo "has_code_changes=false" >> $GITHUB_OUTPUT
            echo "生成されたコードに変更はありません"
          else
            echo "has_code_changes=true" >> $GITHUB_OUTPUT
            echo "生成されたコードに変更があります"
            
            # 変更されたファイル数を取得
            CHANGED_FILES=$(git diff --cached --name-only | wc -l)
            echo "changed_files_count=$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "変更されたファイル数: $CHANGED_FILES"
          fi

      - name: プルリクエストを作成
        if: steps.check_version_changes.outputs.has_version_changes == 'true' && steps.check_code_changes.outputs.has_code_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Kintone API仕様を${{ steps.latest_version.outputs.version }}に更新
            
            - ${{ steps.current_version.outputs.version }} → ${{ steps.latest_version.outputs.version }} に更新
            - PHPクライアントコードを再生成
            - 変更されたファイル数: ${{ steps.check_code_changes.outputs.changed_files_count }}
            - 上流コミット: ${{ steps.upstream_info.outputs.commit_sha }}
          title: "🔄 Kintone API仕様を ${{ steps.latest_version.outputs.version }} に更新"
          body: |
            ## 🔄 Kintone API仕様アップデート
            
            このPRはKintone REST API仕様を更新し、それに合わせてPHPクライアントを再生成します。
            
            ### 📊 変更内容
            - **更新前バージョン**: `${{ steps.current_version.outputs.version }}`
            - **更新後バージョン**: `${{ steps.latest_version.outputs.version }}`
            - **変更されたファイル数**: ${{ steps.check_code_changes.outputs.changed_files_count }}個
            - **上流コミット**: [`${{ steps.upstream_info.outputs.commit_sha }}`](${{ steps.upstream_info.outputs.commit_url }})
            - **コミットメッセージ**: ${{ steps.upstream_info.outputs.commit_message }}
            
            ### 🔗 参考リンク
            - [📋 上流リポジトリの変更を確認](${{ steps.upstream_info.outputs.compare_url }})
            - [📖 Kintone REST API ドキュメント](https://developer.kintone.io/hc/ja/categories/18815983)
            - [🔧 生成されたPHPクライアントの変更を確認](../../compare)
            
            ### ✅ レビューチェックリスト
            - [ ] 生成されたPHPクライアントクラスを確認
            - [ ] APIの破壊的変更がないかチェック
            - [ ] 必要に応じてサンプルコードを更新
            - [ ] 統合テストを実行
            
            ### 📝 メモ
            このアップデートは週次API仕様更新ワークフローによって自動生成されました。  
            マージする前に変更内容を必ずレビューしてください。
            
            ---
            🤖 *GitHub Actionsによって自動生成*
          branch: update/api-spec-${{ steps.latest_version.outputs.version }}
          delete-branch: true
          labels: |
            api-update
            automated
            dependencies

      - name: 実行結果を出力
        run: |
          VERSION_CHANGED="${{ steps.check_version_changes.outputs.has_version_changes }}"
          CODE_CHANGED="${{ steps.check_code_changes.outputs.has_code_changes }}"
          
          if [ "$VERSION_CHANGED" = "false" ]; then
            echo "ℹ️ API仕様のバージョンに変更はありませんでした"
          elif [ "$CODE_CHANGED" = "false" ]; then
            echo "⚠️ API仕様は ${{ steps.latest_version.outputs.version }} に更新されましたが、生成されたPHPクライアントコードに変更はありませんでした"
            echo "この場合、PRは作成されません"
          else
            echo "✅ API仕様が ${{ steps.latest_version.outputs.version }} に更新され、コードに変更があったためPRが作成されました"
          fi
